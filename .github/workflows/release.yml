name: 🚀 Release
on:
  push:
    tags:
      - "prerelease"
      - "release"

jobs:
  detect-changed-adapters:
    name: Detect changed adapters
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      adapters: ${{ steps.build-adapter-matrix.outputs.adapters }}
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve parent SHA of tagged commit
        id: parent-sha
        run: echo "base_sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - name: Detect changed files under adapters/
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: adapters/**
          base_sha: ${{ steps.parent-sha.outputs.base_sha }}
          sha: ${{ github.sha }}
          dir_names: true
          dir_names_max_depth: 2
          matrix: true

      - name: Build adapter matrix
        id: build-adapter-matrix
        env:
          CHANGED_DIRS: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          ADAPTERS=$(jq -c '[.[] | sub("^adapters/"; "")]' <<< "$CHANGED_DIRS")
          echo "adapters=$ADAPTERS" >> "$GITHUB_OUTPUT"
          echo "Adapters to release: $ADAPTERS"

  release:
    name: Release Python package (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    needs: detect-changed-adapters
    if: ${{ needs.detect-changed-adapters.outputs.any_changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs.detect-changed-adapters.outputs.adapters) }}
    steps:
    - name: Release Python package
      run: |
        echo "Releasing Python package for adapter: ${{ matrix.adapter }}, directory: adapters/${{ matrix.adapter }}"
